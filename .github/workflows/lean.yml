name: Lean verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependency cache
        run: lake exe cache get
      - name: Build with bounded concurrency
        run: python3 scripts/build_serial.py
      - name: Audit public results and source hashes
        run: python3 scripts/check_release.py
